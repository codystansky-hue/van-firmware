# Builds the firmware on every push. The .bin is attached to the run (Actions > the run > Artifacts) and, for a tag
# like v3, to a GitHub release -- download it on the phone and upload it on http://maxxfan.local/setup.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ESP32_CORE: "3.3.12"
  ESP32_INDEX: https://espressif.github.io/arduino-esp32/package_esp32_index.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write              # attach the firmware to a release on tags
    steps:
      - uses: actions/checkout@v7

      - uses: arduino/setup-arduino-cli@v2

      - name: Cache the ESP32 core
        uses: actions/cache@v6
        with:
          path: |
            ~/.arduino15
            !~/.arduino15/staging
          key: arduino15-esp32-${{ env.ESP32_CORE }}

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      - name: Build maxxfan
        run: arduino-cli compile --warnings all --output-dir build/maxxfan maxxfan

      - uses: actions/upload-artifact@v7
        with:
          name: maxxfan-firmware
          path: build/maxxfan/maxxfan.ino.bin

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/maxxfan/maxxfan.ino.bin "maxxfan-${GITHUB_REF_NAME}.bin"
          gh release create "$GITHUB_REF_NAME" "maxxfan-${GITHUB_REF_NAME}.bin" --generate-notes
